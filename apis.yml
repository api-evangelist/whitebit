aid: whitebit

name: WhiteBIT

image: https://static.whitebit.com/img/og-image-en.png

description: WhiteBIT is a European centralized cryptocurrency exchange offering spot, collateral (margin/futures) trading, and account/wallet
  services, with public and private REST APIs (v1/v4), OAuth 2.0, and a WebSocket API.

