    Available on the global server (`https://whitebit.com`) only. The EU server (`https://whitebit.eu`)
    does not expose these endpoints in this release.


    Required scopes:

    - `apikeys.read` for `GET /oauth2/api-key/info` and `GET /oauth2/api-key/{externalId}/secret`

    - `apikeys.delete` for `DELETE /oauth2/api-key/{externalId}`


