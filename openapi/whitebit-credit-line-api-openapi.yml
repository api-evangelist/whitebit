openapi: 3.2.0
info:
  title: WhiteBIT Private HTTP API V4 Credit Line API
  description: 'WhiteBIT Private HTTP API V4 for Main balance changes.


    Base URL: https://whitebit.com


    All endpoints return time in Unix-time format.

    All endpoints return either a JSON object or array.

    For receiving responses from API calls please use http method POST.'
  version: 4.0.0
  contact:
    name: WhiteBIT Support
    email: support@whitebit.com
    url: https://whitebit.com
servers:
- url: https://whitebit.com
  description: WhiteBIT Global Server
- url: https://whitebit.eu
  description: WhiteBIT EU Server
- url: https://whitebit.tr
  description: WhiteBIT TR Server
- url: https://whitebit.ge
  description: WhiteBIT GE Server
security:
- ApiKeyAuth: []
  PayloadAuth: []
  SignatureAuth: []
tags:
- name: Credit Line
  description: Credit line information
paths:
  /api/v4/credit-line/loans/info:
    post:
      tags:
      - Credit Line
      summary: List Credit Lines
      description: 'The endpoint returns an active loan.

        The endpoint works on demand - contact WhiteBIT support to get access.


        Rate limit: 1000 requests/10 sec.


        The API does not cache the response.'
      operationId: getCreditLineInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: Request signature
                  example: '{{request}}'
                nonce:
                  type: integer
                  description: Unique request identifier
                  example: 1594297865000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLine'
              example:
                asset: BTC
                amount: '1.5'
                totalFunding: '0.5'
                currentLtv: '25'
                initialLtv: '60'
                marginCallLtv: '75'
                liquidationLtv: '85'
                createdAt: 1715339355
        '400':
          description: No active loan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
              example:
                code: 0
                message: No active loan at the moment
        '404':
          description: Loans not available - contact support
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
              example:
                code: 0
                message: ''
components:
  schemas:
    CreditLine:
      type: object
      properties:
        asset:
          type: string
          example: BTC
        amount:
          type: string
          example: '1.5'
        totalFunding:
          type: string
          example: '0.5'
        currentLtv:
          type: string
          example: '25'
        initialLtv:
          type: string
          example: '60'
        marginCallLtv:
          type: string
          example: '75'
        liquidationLtv:
          type: string
          example: '85'
        createdAt:
          type: integer
          example: 1715339355
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-TXC-APIKEY
      description: The public WhiteBIT API key.
    PayloadAuth:
      type: apiKey
      in: header
      name: X-TXC-PAYLOAD
      description: Base64-encoded JSON request body.
    SignatureAuth:
      type: apiKey
      in: header
      name: X-TXC-SIGNATURE
      description: HMAC-SHA512 signature of the payload, hex-encoded. Computed as hex(HMAC-SHA512(payload, api_secret)).
