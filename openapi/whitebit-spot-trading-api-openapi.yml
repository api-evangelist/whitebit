openapi: 3.2.0
info:
  title: Private HTTP API V4 - Collateral Trading Spot Trading API
  description: 'WhiteBIT Private HTTP API V4 for collateral/margin trading operations.


    Base URL: https://whitebit.com


    All endpoints return time in Unix-time format.

    All endpoints return either a JSON object or array.

    For receiving responses from API calls please use http method POST.


    Authentication required for all endpoints.'
  version: 4.0.0
  license:
    name: WhiteBIT Terms of Service
    url: https://whitebit.com/terms
servers:
- url: https://whitebit.com
  description: WhiteBIT Global Server
- url: https://whitebit.eu
  description: WhiteBIT EU Server
- url: https://whitebit.tr
  description: WhiteBIT TR Server
- url: https://whitebit.ge
  description: WhiteBIT GE Server
security:
- ApiKeyAuth: []
  PayloadAuth: []
  SignatureAuth: []
tags:
- name: Spot Trading
  description: Endpoints for spot trading operations
paths:
  /api/v4/trade-account/balance:
    post:
      summary: Trading Balance
      operationId: tradeAccountBalance
      description: 'The endpoint retrieves the trade balance by currency ticker or all balances. When the `ticker` parameter is provided, the response contains a single currency entry. When omitted, the response contains all currencies with non-zero balances. Each entry includes the `available` balance (funds ready to trade) and the `freeze` balance (funds locked in open orders).


        Rate limit: 12000 requests/10 sec.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticker:
                  type: string
                  description: 'Currency''s [ticker](/glossary#ticker). Example: BTC'
                  example: BTC
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    available:
                      type: string
                      description: Available balance of currency for trading
                    freeze:
                      type: string
                      description: Balance of currency that is currently in active orders
              example:
                BTC:
                  available: '0.123'
                  freeze: '0.01'
                USDT:
                  available: '1000.50'
                  freeze: '100.00'
        '400':
          description: Inner validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticker30:
                  summary: Ticker field should be a string
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      ticker:
                      - Ticker field should be a string.
                ticker30_2:
                  summary: Currency was not found
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      ticker:
                      - Currency was not found.
                amount1:
                  summary: Invalid argument
                  value:
                    code: 1
                    message: Inner validation failed
                    errors:
                      amount:
                      - Invalid argument.
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/order/new:
    post:
      summary: Create Limit Order
      operationId: createLimitOrder
      description: 'The endpoint creates a limit trading order. The order remains on the order book until filled, cancelled, or expired. Minimum and maximum values for `amount` and `price` are market-dependent — query `GET /api/v4/public/markets` for per-market constraints.


        **Order validation rules** (per-market, from `GET /api/v4/public/markets`):

        - `amount` must have at most `stockPrec` decimal places

        - `price` must have at most `moneyPrec` decimal places

        - `amount` must be ≥ `minAmount`

        - `amount × price` must be ≥ `minTotal`

        - `amount × price` must be ≤ `maxTotal` (when `maxTotal` is not `"0"`)


        **Price and amount steps:** from September 18, 2026, `price` must be a multiple of the market `tickSize` and `amount` a multiple of `stepSize`. See Price and amount steps.


        Rate limit: 10000 requests/10 sec.


        - RPI orders do not appear in public order book feeds (`depth`, `bookTicker`). RPI orders are visible only in private active orders and in the exchange UI order book (web/mobile).

        - RPI orders are post-only by design and cannot be used with the IOC flag. The API returns error code `40` when both `rpi=true` and `ioc=true` are used.

        - RPI orders apply post-only behavior automatically — do not also send `postOnly=true`: a request combining `rpi=true` with an explicit `postOnly=true` fails validation.

        - `retail=true` marks the order as a retail-source taker eligible to match RPI-maker liquidity. The Retail flag must be enabled on the account; contact the account manager to enable it.

        - `retail=true` has no effect on a `postOnly=true` or `rpi=true` order. Post-only and RPI orders are makers and cannot be retail takers; an order with both `rpi=true` and `retail=true` matches exactly like an RPI order.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitOrderRequest'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'Inner validation failed


            Error codes:

            - `30` - default validation error code

            - `31` - market validation failed

            - `32` - amount validation failed

            - `33` - price validation failed

            - `36` - clientOrderId validation failed

            - `37` - `ioc=true` cannot be combined with `postOnly=true`

            - `40` - `ioc=true` cannot be combined with `rpi=true`

            - `42` - `retail=true` is not allowed for the account

            - `43` - `rpi=true` is not allowed for the account

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                amount30:
                  summary: Amount field is required
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      amount:
                      - Amount field is required.
                      market:
                      - Market field is required.
                      price:
                      - Price field is required.
                      side:
                      - Side field is required.
                side30:
                  summary: Side field should contain only
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      side:
                      - Side field should contain only 'buy' or 'sell' values.
                amount32:
                  summary: Amount field should be numeric string or number
                  value:
                    code: 32
                    message: Validation failed
                    errors:
                      amount:
                      - Amount field should be numeric string or number.
                price33:
                  summary: Price field should be numeric string or number
                  value:
                    code: 33
                    message: Validation failed
                    errors:
                      price:
                      - Price field should be numeric string or number.
                market31:
                  summary: Market is not available
                  value:
                    code: 31
                    message: Validation failed
                    errors:
                      market:
                      - Market is not available.
                market31_2:
                  summary: Market field should not be empty string
                  value:
                    code: 31
                    message: Validation failed
                    errors:
                      market:
                      - Market field should not be empty string.
                amount32_2:
                  summary: Given amount is less than min amount 0.001
                  value:
                    code: 32
                    message: Validation failed
                    errors:
                      amount:
                      - Given amount is less than min amount 0.001
                      - Min amount step = 0.000001
                clientorderid36:
                  summary: ClientOrderId field should be a string
                  value:
                    code: 36
                    message: Validation failed
                    errors:
                      clientOrderId:
                      - ClientOrderId field should be a string.
                clientorderid36_2:
                  summary: ClientOrderId field should contain only latin letters, numbers and…
                  value:
                    code: 36
                    message: Validation failed
                    errors:
                      clientOrderId:
                      - ClientOrderId field should contain only latin letters, numbers and dashes.
                clientorderid36_3:
                  summary: This client order id is already used by the current account
                  value:
                    code: 36
                    message: Validation failed
                    errors:
                      clientOrderId:
                      - This client order id is already used by the current account.
                ioc37:
                  summary: Either IOC or PostOnly flag in true state is allowed
                  value:
                    code: 37
                    message: Validation failed
                    errors:
                      ioc:
                      - Either IOC or PostOnly flag in true state is allowed.
                total30:
                  summary: Total (amount * price) is less than 5.05
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      total:
                      - Total (amount * price) is less than 5.05
                amount32_3:
                  summary: Min amount step = 0.01
                  value:
                    code: 32
                    message: Validation failed
                    errors:
                      amount:
                      - Min amount step = 0.01
                price33_2:
                  summary: Price field should be at least 10
                  value:
                    code: 33
                    message: Validation failed
                    errors:
                      price:
                      - Price field should be at least 10
                      - Min price step = 0.000001
                price33_3:
                  summary: Price should be greater than 0
                  value:
                    code: 33
                    message: Validation failed
                    errors:
                      price:
                      - Price should be greater than 0.
                makerFee35:
                  summary: Incorrect maker fee
                  value:
                    code: 35
                    message: Validation failed
                    errors:
                      maker_fee:
                      - Incorrect maker fee
                retail42:
                  summary: api.validation.retail.not_allowed
                  value:
                    code: 42
                    message: Validation failed
                    errors:
                      retail:
                      - api.validation.retail.not_allowed
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/order/bulk:
    post:
      summary: Bulk limit order
      operationId: createBulkLimitOrder
      description: 'The endpoint creates bulk limit trading orders. Each order in the batch follows the same validation rules as a single limit order. The `stopOnFail` parameter controls whether processing stops at the first failure or continues through all orders. The response contains a result-or-error pair for each submitted order.


        **Price and amount steps:** from September 18, 2026, the `price` of each order must be a multiple of the market `tickSize` and its `amount` a multiple of `stepSize`. See Price and amount steps.


        Limit: From 1 to 20 orders per request.


        - RPI orders do not appear in public order book feeds (`depth`, `bookTicker`). RPI orders are visible only in private active orders and in the exchange UI order book (web/mobile).

        - RPI orders are post-only by design and cannot be used with the IOC flag. The API returns error code `40` when both `rpi=true` and `ioc=true` are used.

        - RPI orders apply post-only behavior automatically — do not also send `postOnly=true`: a request combining `rpi=true` with an explicit `postOnly=true` fails validation.

        - `retail=true` marks the order as a retail-source taker eligible to match RPI-maker liquidity. The Retail flag must be enabled on the account; contact the account manager to enable it.

        - `retail=true` has no effect on a `postOnly=true` or `rpi=true` item. Post-only and RPI orders are makers and cannot be retail takers; an item with both `rpi=true` and `retail=true` matches exactly like an RPI order.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orders
              - request
              - nonce
              properties:
                orders:
                  type: array
                  description: Array of limit orders. Each item is validated with the same rules as a single limit order.
                  items:
                    $ref: '#/components/schemas/BulkOrderItem'
                stopOnFail:
                  type: boolean
                  default: false
                  description: 'Controls how the bulk order processor handles failures.


                    When true: Processing stops at the first order that fails validation or execution. Only orders up to (but not including) the failed order are processed.


                    When false (default): All orders in the bulk request are processed regardless of individual failures. Each order result is returned in the response array.

                    '
                  example: true
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              orders:
              - side: buy
                amount: '0.02'
                price: '40000'
                market: BTC_USDT
                postOnly: false
                ioc: false
                clientOrderId: ''
                rpi: true
                retail: false
              - side: sell
                amount: '0.0001'
                price: '41000'
                market: BTC_USDT
                postOnly: false
                ioc: false
                clientOrderId: ''
                rpi: false
                retail: true
              - side: sell
                amount: '0.02'
                price: '41000'
                market: BTC_USDT
                postOnly: false
                ioc: false
                clientOrderId: ''
                rpi: false
                retail: false
      responses:
        '200':
          $ref: '#/components/responses/BulkLimitOrderResponse'
        '400':
          description: 'Inner validation failed


            Error codes:

            - `30` - default validation error code

            - `31` - market validation failed

            - `32` - amount validation failed

            - `33` - price validation failed

            - `36` - clientOrderId validation failed

            - `37` - `ioc=true` cannot be combined with `postOnly=true`

            - `40` - `ioc=true` cannot be combined with `rpi=true`

            - `42` - `retail=true` is not allowed for the account

            - `43` - `rpi=true` is not allowed for the account

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                orders30:
                  summary: The orders must be an array
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      orders:
                      - The orders must be an array.
                amount30:
                  summary: Amount field is required
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      amount:
                      - Amount field is required.
                      market:
                      - Market field is required.
                      price:
                      - Price field is required.
                      side:
                      - Side field is required.
                side30:
                  summary: Side field should contain only
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      side:
                      - Side field should contain only 'buy' or 'sell' values.
                amount32:
                  summary: Amount field should be numeric string or number
                  value:
                    code: 32
                    message: Validation failed
                    errors:
                      amount:
                      - Amount field should be numeric string or number.
                price33:
                  summary: Price field should be numeric string or number
                  value:
                    code: 33
                    message: Validation failed
                    errors:
                      price:
                      - Price field should be numeric string or number.
                retail42:
                  summary: api.validation.retail.not_allowed
                  value:
                    code: 42
                    message: Validation failed
                    errors:
                      retail:
                      - api.validation.retail.not_allowed
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/order/market:
    post:
      summary: Create market order
      operationId: createMarketOrder
      description: 'The endpoint creates a market trading order. The matching engine executes the order immediately at the best available price. For buy orders, `amount` represents the total in quote (money) currency to spend. For sell orders, `amount` represents the quantity in base (stock) currency to sell. Minimum and maximum values are market-dependent. Query `GET /api/v4/public/markets` for `minAmount`, `minTotal`, and `maxTotal`.


        **Amount step:** from September 18, 2026, `amount` on a sell order must be a multiple of the market `stepSize`. A buy order carries the quote-currency total in `amount`, so the step does not apply to it. See Price and amount steps.


        Rate limit: 10000 requests/10 sec.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketOrderRequest'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
