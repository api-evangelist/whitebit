  /api/v4/order/cancel/bulk:
    post:
      summary: Cancel bulk orders
      operationId: cancelBulkOrders
      description: 'The endpoint cancels up to 100 orders in a single request. Each item identifies a target order by `market` plus exactly one of `orderId` or `clientOrderId`. The response is an array whose items match the input order one-to-one — `response[i]` corresponds to `request.orders[i]`.


        Rate limit: 10000 requests/10 sec.


        Limit: From 1 to 100 orders per request.


        - Provide exactly one of `orderId` or `clientOrderId` per item. Sending both, or neither, returns a per-item validation error.

        - The endpoint always processes every item independently. There is no `stopOnFail`-style switch.

        - When the caller is not authenticated, the API returns the standard authorization error and skips per-item validation.


        **`timestamp` and `mtime` on a successful item:** a canceled item''s `result` may echo the order''s `timestamp` (creation time) and `mtime` (the last time the matching engine modified the order — the moment of cancellation, since a cancellation is an order''s final modification). Both are best-effort echoes: either may be omitted, so do not rely on either field''s presence. For a cancel response that always includes `mtime`, use the single Cancel order endpoint instead.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orders
              - request
              - nonce
              properties:
                orders:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Array of orders to cancel. From 1 to 100 items per request.
                  items:
                    $ref: '#/components/schemas/BulkCancelOrderItem'
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              orders:
              - market: BTC_USDT
                orderId: 4326248250
              - market: ETH_USDT
                clientOrderId: my-client-id
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: "Bulk cancel result. The response is an array — `response[i]` corresponds to `request.orders[i]`. Each item contains either a `result` (cancellation succeeded) or an `error` (cancellation failed for that item). Partial failures within the array are normal; the request itself returns HTTP 200.\n\nPer-item error codes: `30` (validation failure), `404` (order not found), `500` (trade service unavailable). A failed item carries an `error` object following the standard error shape, for example:\n\n```json\n{\n  \"result\": null,\n  \"error\": {\n    \"code\": 30,\n    \"message\": \"Validation failed\",\n    \"errors\": { \"market\": [\"validation.required\"] }\n  }\n}\n```\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCancelOrderResponse'
        '400':
          description: Inner validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/order/cancel/all:
