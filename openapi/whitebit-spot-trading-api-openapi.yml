  /api/v4/trade-account/order:
    post:
      summary: Query executed order deals
      operationId: getOrderDeals
      description: 'The endpoint retrieves individual trade fills (deals) for a specific order, which may belong to a spot, margin, or futures market. Each deal represents a partial or full execution of the order against a counterparty. The response includes pagination and returns deal details such as price, amount, fee, and execution role (maker or taker).


        Rate limit: 12000 requests/10 sec.


        This endpoint supports pagination. Use `limit` (default: 500, max: 500) and `offset` (default: 0, max: 1000) to page through results. The response does not include a `total` field — detect the last page when `records.length


        An unknown or not-owned `orderId` is **not** an error. The endpoint always returns HTTP 200 with the paged-list envelope; a non-matching `orderId` simply filters down to an empty `records` array.


        The endpoint can retrieve data not older than 6 months from the current month. For older data, use the Report on the History page. An order older than this window returns an empty `records` array even when the order was filled.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orderId
              - request
              - nonce
              properties:
                orderId:
                  type: integer
                  description: Identifier of the order to retrieve deals for.
                  example: 3134995325
                offset:
                  type: integer
                  default: 0
                  minimum: 0
                  maximum: 1000
                  description: 'Number of records to skip. Default: `0`. Maximum: `1000`.'
                  example: 0
                limit:
                  type: integer
                  default: 500
                  minimum: 1
                  maximum: 500
                  description: 'Maximum number of records to return. Default: `500`. Minimum: `1`. Maximum: `500`.'
                  example: 50
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
      responses:
        '200':
          description: Successful response - returns paginated order deals
          content:
