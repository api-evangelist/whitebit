      summary: Cancel order
      operationId: cancelOrder
      description: 'The endpoint cancels an existing order. Provide either `orderId` or `clientOrderId` to identify the target order. The response returns the final state of the cancelled order.


        Rate limit: 10000 requests/10 sec.


        - The request accepts exactly one identifier: either `orderId` or `clientOrderId`.

        - Sending both identifiers, or neither, returns a validation error.

        - `timestamp` is the order''s creation time. `mtime` is the time the matching engine last modified the order, which on a cancellation is the moment the cancellation was processed.'
