      description: 'The endpoint retrieves the history of executed and cancelled orders across spot, margin, and futures markets. The response groups orders by market name. Use the `market` parameter to filter by a single trading pair, or omit the parameter to retrieve orders across all markets. The endpoint supports pagination with `limit` (default 50, max 500) and `offset` parameters. Results are ordered by time, newest first.


        Rate limit: 12000 requests/10 sec.


        Requests with `limit` values above 100 return large payloads. Use high limits only when necessary and ensure the client application can handle large response sizes.


        This endpoint supports pagination. Use `limit` (default: 50, max: 500) and `offset` (default: 0) to page through results. The response does not include a `total` field — detect the last page when fewer than `limit` records are returned (sum the records across all markets when no `market` filter is set). An empty response means you have paged past the end; receiving exactly `limit` records does not guarantee that another page exists.


        **Date filter window:** the maximum span between `startDate` and `endDate` is **31 days**, and the earliest reachable date is **6 months ago (00:00 UTC)**. Requests that exceed the 31-day window or fall below the 6-month floor are rejected with a validation error. `endDate` values greater than the current time are silently clamped to `now`.


        For B2B accounts, canceled orders are not recorded in the history. To obtain canceled-order data, contact support or the assigned account manager.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market:
                  type: string
                  description: 'Trading pair to filter by. Format: `BASE_QUOTE` (e.g., `BTC_USDT`). Omit to retrieve orders across all markets.'
                  example: BTC_USDT
                clientOrderId:
                  type: string
                  description: Look up a specific order by the custom client identifier. When supplied, the endpoint switches to single-order lookup mode and the `startDate`, `endDate`, and `status` filters are ignored. Returns `422` with `"OrderHistory was not found."` if no order matches. Ignored when `orderId` is also provided.
                  example: customId11
                orderId:
                  type: integer
                  description: Look up a specific order by the exchange-assigned identifier. When supplied, the endpoint switches to single-order lookup mode and the `startDate`, `endDate`, and `status` filters are ignored. Returns an empty result on no match (no `422`). Takes precedence over `clientOrderId` when both are supplied.
                  example: 4986126152
                status:
                  type: string
                  enum:
                  - ALL
                  - FILLED
                  - CANCELED
                  - PARTIALLY_FILLED
                  - MAINTENANCE
                  default: ALL
                  description: Filter list-mode results by order status. Ignored when `orderId` or `clientOrderId` is supplied. `MAINTENANCE` returns only the orders the platform canceled during planned market maintenance; those orders are not part of the `CANCELED` result set, which covers user and automatic cancellations.
                  example: FILLED
                startDate:
                  type: integer
                  description: 'Start of the query window as a Unix timestamp in seconds. Default: `now - 1 month`. The earliest reachable date is 6 months ago (00:00 UTC) — requests with an older `startDate` are rejected with a validation error.'
                  example: 1697000000
                endDate:
                  type: integer
                  description: 'End of the query window as a Unix timestamp in seconds. Default: `now`. Values greater than the current time are silently clamped to `now`. The maximum span between `startDate` and `endDate` is 31 days.'
                  example: 1699000000
                offset:
                  type: integer
                  default: 0
                  minimum: 0
                  description: 'Number of records to skip. Default: `0`.'
                  example: 0
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 50
                  description: 'Maximum number of records to return. Default: `50`. Minimum: `1`. Maximum: `500`.'
                  example: 50
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
      responses:
        '200':
          description: Successful response - returns order history grouped by market. Empty response if order is not yours.
          content:
            application/json:
              schema:
                type: object
                description: Object with market names as keys, each containing an array of orders
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      amount:
                        type: string
                        description: Order quantity in base currency for limit orders, or in quote currency for buy market orders.
                        example: '0.0009'
                      price:
                        type: string
                        description: Limit price per unit in quote currency. Returns `"0"` for market orders.
                        example: '40000'
                      type:
                        type: string
                        description: 'Order type. Possible values: `limit`, `market`, `stock market`, `stop limit`, `stop market`.'
                        example: limit
                      id:
                        type: integer
                        description: Unique order identifier assigned by the matching engine.
                        example: 4986126152
                      clientOrderId:
                        type: string
                        description: Custom client order identifier supplied in the request. Returns an empty string when not specified.
                        example: customId11
                      side:
                        type: string
                        description: 'Order side. Possible values: `buy`, `sell`.'
                        enum:
                        - buy
                        - sell
                        example: sell
                      ctime:
                        type: number
                        description: Unix timestamp in seconds (UTC) of order creation, with microsecond precision.
                        example: 1597486960.311311
                      ftime:
                        type: number
                        description: Unix timestamp when the order reached its final status (FILLED or CANCELED). For partially-filled orders that are subsequently canceled, the timestamp reflects the cancellation time, not the last fill time.
                        example: 1597486960.311332
                      dealFee:
                        type: string
                        description: Cumulative trading fee charged for filled portions, denominated in the fee asset.
                        example: '0.041258268'
                      dealStock:
                        type: string
                        description: Filled amount in base (stock) currency.
                        example: '0.0009'
                      dealMoney:
                        type: string
                        description: Filled amount in quote (money) currency.
                        example: '41.258268'
                      postOnly:
                        type: boolean
                        description: Post-only flag. When `true`, the order executed only as a maker order.
                        example: false
                      ioc:
                        type: boolean
                        description: Immediate-or-cancel flag. When `true`, the order executed available quantity immediately and cancelled the rest.
                        example: false
                      activated:
                        type: integer
                        description: Stop/conditional orders only — Unix timestamp at which the trigger price was reached and the order was activated. Absent for unconditional orders.
                        example: 1597486960
                      activationPrice:
                        type: string
                        description: Stop/conditional orders only — the trigger price that, when reached, activates the order. Absent for unconditional orders.
                        example: '39500'
                      activationCondition:
                        type: string
                        description: Stop/conditional orders only — comparison operator that decides when `activationPrice` is met. Absent for unconditional orders.
                        example: <=
                      status:
                        $ref: '#/components/schemas/OrderHistoryStatus'
                      feeAsset:
                        type: string
                        description: Currency ticker of the asset used to pay the trading fee.
                        example: USDT
                      positionSide:
                        type: string
                        description: Position side for futures/margin orders. Omitted for spot orders without position context.
                        example: BOTH
                      rpi:
                        type: boolean
                        description: Retail Price Improvement flag. `true` when the order used RPI pricing.
                        example: false
                      reduceOnly:
                        type: boolean
                        description: Reduce-only flag. When `true`, the order could only reduce or close an existing position. See [reduce-only](/glossary#reduce-only).
                        example: false
              example:
                BTC_USDT:
                - amount: '0.0009'
                  price: '40000'
                  type: limit
                  id: 4986126152
                  clientOrderId: customId11
                  side: sell
                  ctime: 1597486960.311311
                  ftime: 1597486960.311332
                  dealFee: '0.041258268'
                  dealStock: '0.0009'
                  dealMoney: '41.258268'
                  postOnly: false
                  ioc: false
                  status: CANCELED
                  feeAsset: USDT
                  positionSide: BOTH
                  rpi: false
                  reduceOnly: false
                - amount: '0.05'
                  price: '39000'
                  type: limit
                  id: 4986126890
                  clientOrderId: ''
                  side: buy
                  ctime: 1597486100.100011
                  ftime: 1597486700.400022
                  dealFee: '0'
                  dealStock: '0'
                  dealMoney: '0'
                  postOnly: false
                  ioc: false
                  status: MAINTENANCE
                  feeAsset: USDT
                  positionSide: BOTH
                  rpi: false
                  reduceOnly: false
        '400':
          description: Inner validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                orderhistory30:
                  summary: OrderHistory was not found
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      orderHistory:
                      - OrderHistory was not found.
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/trade-account/order/history/query:
    post:
      summary: Query delisting and maintenance orders
      operationId: getDelistingOrderHistory
      description: 'The endpoint returns the authenticated account''s delisting- and maintenance-related order history across spot, margin, and futures markets, from the order-history index. The response combines three categories of orders: reverse close orders that the platform generates when a market is delisted (`delistingKind` = `reverse`, `clientOrderId` prefixed with `delisting-`), active orders canceled at the moment of delisting (`delistingKind` = `canceled`), and orders canceled when a market entered planned maintenance (response `status` = `maintenance`, `delistingKind` empty). The endpoint returns a flat array sorted by `finishAt` descending, then `id` descending.


        Set the `status` parameter to narrow the response: `filled` returns only reverse close orders that reached the `filled` outcome, `delisting` returns only orders canceled during delisting, and `maintenance` returns only orders canceled during planned market maintenance. Omit `status` to return all three categories merged in a single array.


        The endpoint supports pagination via `limit` (default: 500, max: 500) and `offset` (default: 0); the sum of `offset` and `limit` must not exceed 10000. A response that returns fewer than `limit` records indicates the last page.


        **Date filter window:** the date range filters orders by the `finishAt` timestamp. The maximum span between `startDate` and `endDate` is **31 days**. `endDate` values greater than the current time are clamped to `now`.


        Rate limit: 10000 requests/10 sec.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market:
                  type: string
                  description: 'Trading pair to filter by. Format: `BASE_QUOTE` (e.g., `BTC_USDT`), matching the pattern `^[A-Z0-9]+_[A-Z0-9]+$`. Omit to retrieve records across all markets.'
                  example: BTC_USDT
                status:
                  type: string
                  enum:
                  - filled
                  - delisting
                  - maintenance
                  description: Category filter — distinct from the response `status` field. `filled` returns only reverse close orders (`clientOrderId` prefixed with `delisting-`), which carry `delistingKind` = `reverse` and response `status` = `filled`. `delisting` returns only orders canceled at delisting, which carry `delistingKind` = `canceled` and response `status` = `canceled`. `maintenance` returns only orders canceled during planned market maintenance, which carry response `status` = `maintenance` and an empty `delistingKind`. Omit to return all three categories merged.
                  example: filled
                startDate:
                  type: integer
                  description: 'Start of the query window as a Unix timestamp in seconds. Default: `now - 30 days`. Must not be later than `endDate`.'
                  example: 1731369600
                endDate:
                  type: integer
                  description: 'End of the query window as a Unix timestamp in seconds. Default: `now`. Values greater than the current time are clamped to `now`. The maximum span between `startDate` and `endDate` is 31 days.'
                  example: 1733961600
                offset:
                  type: integer
                  default: 0
                  minimum: 0
                  maximum: 9999
                  description: 'Number of records to skip. Default: `0`. The sum of `offset` and `limit` must not exceed 10000.'
                  example: 0
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 500
                  description: 'Maximum number of records to return. Default: `500`. Minimum: `1`. Maximum: `500`.'
                  example: 500
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
      responses:
        '200':
          description: Successful response - returns a flat array of delisting- and maintenance-related orders sorted by `finishAt` descending, then `id` descending. Returns an empty array when no records match the filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique order identifier assigned by the matching engine.
                      example: 2286423327099
                    clientOrderId:
                      type: string
                      description: Custom client order identifier. Reverse close orders carry the platform-generated value prefixed with `delisting-`. Returns an empty string when the original order had no client identifier.
                      example: delisting-2286423327099
                    createdAt:
                      type: number
                      description: Unix timestamp in seconds (UTC) of order creation, with microsecond precision.
                      example: 1778077388.002424
                    finishAt:
                      type: number
                      description: Unix timestamp in seconds (UTC) at which the order reached its final status, with microsecond precision. Primary sort key, descending.
                      example: 1778077400.123456
                    market:
                      type: string
                      description: 'Trading pair the order belongs to. Format: `BASE_QUOTE`.'
                      example: BTC_USDT
                    side:
                      type: string
                      enum:
                      - buy
                      - sell
                      description: 'Order side. Possible values: `buy`, `sell`.'
                      example: sell
                    type:
                      type: string
                      description: 'Order type. Possible values: `limit`, `market`, `stock market`, `stop limit`, `stop market`.'
                      example: market
                    price:
                      type: string
                      description: Limit price per unit in quote currency. Returns `"0"` for market orders.
                      example: '61234.5000000000'
                    amount:
                      type: string
                      description: Order quantity in base currency for limit orders, or in quote currency for buy market orders.
                      example: '0.0500000000'
                    dealStock:
                      type: string
                      description: Filled amount in base (stock) currency.
                      example: '0.0500000000'
                    dealMoney:
                      type: string
                      description: Filled amount in quote (money) currency.
                      example: '3061.7250000000'
                    fee:
                      type: string
                      description: Cumulative trading fee charged for filled portions, denominated in the fee asset.
                      example: '1.5308625000'
                    feeAsset:
                      type: string
                      description: Currency ticker of the asset used to pay the trading fee.
                      example: USDT
                    status:
                      type: string
                      description: Execution outcome in lowercase. Reverse close orders that filled return `filled`. Orders canceled during delisting return `canceled`. Orders canceled during planned market maintenance return `maintenance`.
                      example: filled
                    delistingKind:
                      type: string
                      enum:
                      - reverse
                      - canceled
                      - ''
                      description: Delisting category discriminator. `reverse` marks a reverse close order generated by the platform. `canceled` marks an active order canceled at the moment of delisting. The field is always present and carries an empty string for records that are not delisting-related, which is the case for maintenance cancellations — read `status` to identify those.
                      example: reverse
              example:
              - id: 2287000111222
                clientOrderId: user-custom-id-7
                createdAt: 1777991000.0
                finishAt: 1778078000.0
                market: BTC_USDT
                side: buy
                type: limit
                price: '61000.0000000000'
                amount: '0.0500000000'
                dealStock: '0.0000000000'
                dealMoney: '0.0000000000'
                fee: '0.0000000000'
                feeAsset: USDT
                status: canceled
                delistingKind: canceled
              - id: 2286423327099
                clientOrderId: delisting-2286423327099
                createdAt: 1778077388.002424
                finishAt: 1778077400.123456
                market: BTC_USDT
                side: sell
                type: market
                price: '61234.5000000000'
                amount: '0.0500000000'
                dealStock: '0.0500000000'
                dealMoney: '3061.7250000000'
                fee: '1.5308625000'
                feeAsset: USDT
                status: filled
                delistingKind: reverse
              - id: 2288100455333
                clientOrderId: user-custom-id-9
                createdAt: 1778090000.0
                finishAt: 1778090400.0
                market: ETH_USDT
                side: buy
                type: limit
                price: '2450.0000000000'
                amount: '1.5000000000'
                dealStock: '0.0000000000'
                dealMoney: '0.0000000000'
                fee: '0.0000000000'
                feeAsset: USDT
                status: maintenance
                delistingKind: ''
        '400':
          description: Inner validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/order/modify:
    post:
      summary: Modify order
      operationId: modifyOrder
      description: 'The endpoint modifies an existing order on spot, margin, and futures markets. There is no separate collateral path: collateral orders go through this endpoint, and the `market` parameter identifies which market the order belongs to.


        Supported order types: limit, stop limit, stop market. On collateral markets the supported types are the collateral limit, collateral stop-limit, and collateral trigger-market orders.


        Request must contain at least one of the following parameters: amount, total, price, activationPrice.


        **Price and amount steps:** from September 18, 2026, a `price` or `activationPrice` sent in the request must be a multiple of the market `tickSize`, and `amount` a multiple of `stepSize`. A buy stop-market modification sends `total` in quote currency, which the step does not apply to. See Price and amount steps.


        Rate limit: 10000 requests/10 sec.


        - Use total parameter instead of amount for modify buy stop market order. `amount` and `total` are mutually exclusive — a request sending both is rejected.

        - The request accepts exactly one identifier: either `orderId` or `clientOrderId`.

        - Sending both identifiers, or neither, returns a validation error.

        - Group legs cannot be modified. An OCO or OTO leg returns error `155`: cancel the group and place a new one. A TPSL leg returns error `160`: cancel the leg and attach a new pair.


        **WebSocket impact:** Each call to the endpoint cancels the original order and

        creates a replacement with a **new `orderId`**. Clients subscribed to the

        `ordersPending_update` WebSocket channel will receive:

        - `event_id=3` (cancel) for the old order

        - `event_id=1` (new) for the replacement


        Update any `orderId` references after a successful modify response.

        Use `clientOrderId` for stable order tracking across modifications.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - request
              - nonce
              properties:
                orderId:
                  type: integer
                  description: Active order id. Required if clientOrderId is not set.
                  example: 4180284841
                clientOrderId:
                  type: string
                  description: Identifier should be unique and contain letters, dashes, numbers, dots or underscores. Required if orderId is not set.
                  example: order1987111
                market:
                  type: string
                  description: 'Available [market](/glossary#market). Example: BTC_USDT'
                  example: BTC_USDT
                amount:
                  type: string
                  description: 'Amount of [stock](/glossary#stock) currency to buy or sell. Example: ''0.001'' or 0.001'
                  example: '0.001'
                total:
                  type: string
                  description: 'Total of [money](/glossary#money) currency to buy or sell. Example: ''0.001'' or 0.001'
                  example: '100'
                price:
                  type: string
                  description: 'Price in [money](/glossary#money) currency. Example: ''9800'' or 9800'
                  example: '9800'
                activationPrice:
                  type: string
                  description: 'Activation price in [money](/glossary#money) currency. Example: ''10000'' or 10000'
                  example: '10000'
                stp:
                  type: string
                  enum:
                  - 'no'
                  - cb
                  - cn
                  - co
                  default: 'no'
                  description: 'Self-trade prevention mode. Allowed values: `no` (self-trades allowed), `cb` (cancel both the new and the existing order), `cn` (cancel the new order, keep the existing), `co` (cancel the existing order, place the new one). Default: `no`.


                    Legacy values `cancel_both`, `cancel_new`, `cancel_old` are deprecated: the API accepts the legacy values with identical behavior until a deprecation deadline is announced, then rejects the legacy values. Responses always return the abbreviated form, regardless of which variant the request used.


                    See [Self-Trade Prevention](/platform/self-trade-prevention).

                    '
                  example: 'no'
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
      responses:
        '200':
          description: Order modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'Bad request. Client errors: invalid arguments, order not found, quote expired, activation price issues.


            Error codes: `1`, `2`, `6`, `20`, `24`, `101`, `158`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                orderNotFound:
                  summary: Order not found
                  value:
                    code: 2
                    message: Inner validation failed
                    errors:
                      orderId:
                      - Unexecuted order was not found.
        '422':
          description: 'Unprocessable entity. Business-logic validation failed: balance insufficient, trading restrictions, order type conflicts, price bands exceeded.


            Error codes: `10`, `11`, `12`, `13`, `14`, `15`, `16`, `17`, `25`, `27`, `40`, `42`, `51`, `103`, `104`, `105`, `106`, `111`, `112`, `113`, `114`, `115`, `150`, `151`, `152`, `153`, `155`, `157`, `159`, `160`, `161`, `162`, `163`, `250`, `251`, `300`, `302`, `330`, `10011`.


            `10011` is returned when the order being modified belongs to a TradFi market and TradFi trading is restricted for the account. Canceling such an order is always allowed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                marketUnavailable:
                  summary: Market is not available
                  value:
                    code: 31
                    message: Validation failed
                    errors:
                      market:
                      - Market is not available.
                insufficientBalance:
                  summary: Not enough balance
                  value:
                    code: 10
                    message: Validation failed
                    errors:
                      amount:
                      - Not enough balance.
        '503':
          description: Service temporarily unavailable
  /api/v4/order/kill-switch:
    post:
      summary: Sync kill-switch timer
      operationId: setKillSwitch
      description: 'The endpoint creates, updates, or deletes a kill-switch timer. The kill-switch acts as a safety mechanism for automated trading systems — the timer automatically cancels all open orders for the specified market if the client fails to reset the timer before expiration. Set `timeout` to a value between `5` and `600` (seconds) to create or update a timer. Set `timeout` to `null` to delete an existing timer.


        Rate limit: 10000 requests/10 sec.


        - If timeout=null - delete existing timer by market.

        - If types=null - create timer by market for all order types.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - timeout
              properties:
                market:
                  type: string
                  description: 'Available [market](/glossary#market). Example: BTC_USDT'
                  example: BTC_USDT
                timeout:
                  type:
                  - string
                  - 'null'
                  description: Timer value in seconds ('5'-'600'), or `null` to delete the existing timer. The key must always be present — omitting it fails validation.
                  example: '60'
                types:
                  type: array
                  minItems: 1
                  maxItems: 3
                  description: 'Order types to target. Valid values: "spot" — standard spot orders. "margin" — marginal orders placed on spot markets. Note: the "margin" value is not the same as the collateral account balance; "collateral" in other endpoints refers to the funding account, whereas "margin" here refers specifically to the order type. "futures" — marginal orders placed on futures markets (e.g., BTC_PERP). If omitted, the API targets all order types.'
                  example:
                  - spot
                  - margin
                  items:
                    type: string
                    enum:
                    - spot
                    - margin
                    - futures
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
      responses:
        '200':
          description: 'Successful response — creating or updating a timer returns the timer object; deleting a timer (`timeout: null`) returns a literal empty array (`[]`).'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  title: Timer created or updated
                  properties:
                    market:
                      type: string
                      description: Trading pair the timer applies to.
                      example: BTC_USDT
                    startTime:
                      type: integer
                      description: Unix timestamp (seconds) when the timer was created or last reset.
                      example: 1662478154
                    cancellationTime:
                      type: integer
                      description: Unix timestamp (seconds) when the kill-switch will cancel orders. Equals `startTime + timeout`.
                      example: 1662478154
                    types:
                      type:
                      - array
                      - 'null'
                      description: 'Order types targeted by the kill-switch. Possible values: `spot`, `margin`, `futures`. Returns `null` when the timer was created without `types` (the kill-switch then targets all order types).'
                      items:
                        type: string
                        enum:
                        - spot
                        - margin
                        - futures
                      example:
                      - spot
                      - margin
                - type: array
                  title: Timer deleted
                  description: 'Deleting a timer (`timeout: null`) returns a literal empty array (`[]`).'
                  maxItems: 0
                  items: {}
              examples:
                timerSynced:
                  summary: Timer created or updated
                  value:
                    market: BTC_USDT
                    startTime: 1662478154
                    cancellationTime: 1662478154
                    types:
                    - spot
                    - margin
                timerDeleted:
                  summary: Timer deleted
                  value: []
        '400':
          description: 'Inner validation failed


            Error codes:

            - `30` - default validation error code

            - `31` - market validation failed

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                market30:
                  summary: Market field is required
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      market:
                      - Market field is required.
                      timeout:
                      - Timeout field is required.
                market31:
                  summary: Market is not available
                  value:
                    code: 31
                    message: Validation failed
                    errors:
                      market:
                      - Market is not available.
                timeout30:
                  summary: Timeout should be at least 5
                  value:
                    code: 30
                    message: Validation failed
                    errors:
                      timeout:
                      - Timeout should be at least 5.
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v4/order/kill-switch/status:
    post:
      summary: Status kill-switch timer
      operationId: getKillSwitchStatus
      description: 'The endpoint retrieves the status of active kill-switch timers. The response returns an array of timer objects for the specified market, or for all markets if the `market` parameter is omitted. Each timer object includes the start time, scheduled cancellation time, and targeted order types.


        Rate limit: 10000 requests/10 sec.'
      tags:
      - Spot Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market:
                  type: string
                  description: 'Available [market](/glossary#market). Example: BTC_USDT'
                  example: BTC_USDT
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
      responses:
        '200':
          description: Successful response - returns array of kill-switch timer statuses
          content:
            application/json:
              schema:
                type: array
                description: Array of active kill-switch timers
                items:
                  type: object
                  properties:
                    market:
                      type: string
                      description: Trading pair the timer applies to.
                      example: BTC_USDT
                    startTime:
                      type: integer
                      description: Unix timestamp (seconds) when the timer was created or last reset.
                      example: 1686127243
                    cancellationTime:
                      type: integer
                      description: Unix timestamp (seconds) when the kill-switch will cancel orders. Equals `startTime + timeout`.
                      example: 1686127343
                    types:
                      type:
                      - array
                      - 'null'
                      description: 'Order types targeted by the kill-switch. Possible values: `spot`, `margin`, `futures`. Returns `null` when the timer was created without `types` (the kill-switch then targets all order types).'
                      items:
                        type: string
                        enum:
                        - spot
                        - margin
                        - futures
                      example:
                      - spot
                      - margin
              example:
              - market: BTC_USDT
                startTime: 1686127243
                cancellationTime: 1686127343
                types:
                - spot
                - margin
        '400':
          description: 'Inner validation failed


            Error codes:

            - `30` - default validation error code

            - `31` - market validation failed

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                market31:
                  summary: Market is not available
                  value:
                    code: 31
                    message: Validation failed
                    errors:
                      market:
                      - Market is not available.
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LimitOrderRequest:
      type: object
      required:
      - market
      - side
      - amount
      - request
      - nonce
      properties:
        market:
          type: string
          description: 'Trading pair. Format: `BASE_QUOTE` (e.g., `BTC_USDT`). Query `GET /api/v4/public/markets` for available markets.'
          example: BTC_USDT
        side:
          type: string
          enum:
          - buy
          - sell
          description: 'Order side. Allowed values: `buy`, `sell`.'
          example: buy
        amount:
          type: string
          description: 'Order quantity in base (stock) currency. Minimum and maximum values are market-dependent. Query `GET /api/v4/public/markets` for `minAmount`, `minTotal`, `maxTotal`. Precision: `stockPrec`.'
          example: '0.001'
        price:
          type: string
          description: 'Limit price per unit in quote (money) currency. Required unless `bboRole` is set — the BBO execution method replaces the explicit price. Minimum and maximum values are market-dependent. Precision: `moneyPrec`.'
          example: '9800'
        clientOrderId:
          type: string
          description: Custom client order identifier. Uniqueness is enforced only among the account's open (pending) orders on the same market — once a previous order is filled or canceled, the same identifier can be reused, including on the same market. Contains only letters, numbers, dashes, dots, or underscores.
          example: order1987111
        postOnly:
          type: boolean
          default: false
          description: 'Post-only flag. When `true`, the order executes only as a [maker](/glossary#maker) order and the system rejects the order if it would match immediately. Allowed only when `bboRole` is not set. Do not combine with `rpi=true` — RPI orders apply post-only behavior automatically, and a request setting both flags fails validation. Default: `false`.'
          example: false
        ioc:
          type: boolean
          default: false
          description: 'Immediate-or-cancel (IOC) flag. When `true`, the matching engine executes all or part of the order immediately and cancels any unfilled portion. Default: `false`.


            IOC does not support `rpi=true` because RPI uses post-only behavior by design.

            The API returns error code `40` when a request sets both `ioc=true` and `rpi=true`.

            IOC cannot be combined with `postOnly=true` (error code `37`), and with `bboRole` it is allowed only for the Counterparty method (`2`).


            Refer to [Order Parameter Rules](/guides/order-parameter-rules) for unsupported parameter combinations.

            '
          example: false
        bboRole:
          type: integer
          enum:
          - 1
          - 2
          description: 'Best Bid/Offer ([BBO](/glossary#best-bid-offer-bbo)) execution method. The system selects the best market price for execution. `1` = Queue method, `2` = Counterparty method.


            When `bboRole` is set, `price` is not required — the BBO method determines the execution price. `postOnly` is allowed only when `bboRole` is not set; `ioc` can be combined only with the Counterparty method (`2`). Use method `2` with the `ioc` flag.


            Refer to [Order Parameter Rules](/guides/order-parameter-rules) for the full interaction rules.

            '
        stp:
          type: string
          enum:
          - 'no'
          - cb
          - cn
          - co
          default: 'no'
          description: 'Self-trade prevention mode. Allowed values: `no` (self-trades allowed), `cb` (cancel both the new and the existing order), `cn` (cancel the new order, keep the existing), `co` (cancel the existing order, place the new one). Default: `no`.


            Legacy values `cancel_both`, `cancel_new`, `cancel_old` are deprecated: the API accepts the legacy values with identical behavior until a deprecation deadline is announced, then rejects the legacy values. Responses always return the abbreviated form, regardless of which variant the request used.


            See [Self-Trade Prevention](/platform/self-trade-prevention).

            '
          example: 'no'
        rpi:
          type: boolean
          default: false
          description: 'Enables Retail Price Improvement (RPI) mode. Default: `false`.


            RPI orders apply post-only behavior automatically — do not also send an explicit `postOnly=true`: a request combining the two flags fails validation. An RPI order does not support `ioc=true`.

            The API returns error code `40` when a request sets both `rpi=true` and `ioc=true`.

            RPI orders do not appear in public order book feeds (`depth`, `bookTicker`). RPI orders are visible only in private active orders and in the exchange UI order book (web/mobile).

            RPI executions may apply custom fees or rebates, especially when trading via sub-accounts. Use Query Market Fees to verify effective fees.


            Refer to [Order Parameter Rules](/guides/order-parameter-rules) for unsupported parameter combinations.

            '
          example: true
        retail:
          type: boolean
          default: false
          description: 'Retail-source taker flag. When `true`, the order is eligible to match against orders submitted by RPI makers and may receive price improvement at execution. Default: `false`.


            The Retail flag must be enabled on the account before a private-API request can set `retail=true`. Contact the account manager to enable the Retail flag.


            The flag has no effect on a `postOnly=true` or `rpi=true` order. Post-only and RPI orders are [makers](/glossary#maker); only takers carry the retail designation. An order with both `rpi=true` and `retail=true` matches exactly like an RPI order.


            Refer to [Retail flag](/glossary#retail-flag) and [Order Parameter Rules](/guides/order-parameter-rules) for unsupported parameter combinations.

            '
          example: false
        request:
          type: string
          example: '{{request}}'
        nonce:
          type: integer
          example: 1594297865000
    OrderStatus:
      type: string
      description: Order lifecycle status. `FILLED` — fully executed. `CANCELED` — canceled before execution. `PARTIALLY_FILLED` — partially executed, remainder still active. `CANCELED_TAKER_BAND` — partially filled up to the taker band limit, remainder canceled to protect against excessive order book slippage. `AUTO_CANCELED_REDUCE_ONLY` — pending reduce-only order auto-canceled because the associated position was closed. `AUTO_CANCELED_LIQUIDATION` — pending order auto-canceled because the associated position was force-liquidated. `CANCELED_STP` — order canceled by [Self-Trade Prevention](/platform/self-trade-prevention). REST returns the single-`L` spelling throughout; `NEW` and `PARTIAL_FILLED` are not REST values (`NEW` is WebSocket-only; the partially-filled state is `PARTIALLY_FILLED`).
      example: FILLED
    BulkOrderItem:
      type: object
      required:
      - market
      - side
      - amount
      properties:
        side:
          type: string
          enum:
          - buy
          - sell
          description: 'Order side. Allowed values: `buy`, `sell`.'
          example: buy
        amount:
          type: string
          description: Order quantity in base (stock) currency. Minimum and maximum values are market-dependent. Query `GET /api/v4/public/markets` for `minAmount` and precision (`stockPrec`).
          example: '0.001'
        price:
          type: string
          description: Limit price per unit in quote (money) currency. Required unless `bboRole` is set — the BBO execution method replaces the explicit price. Minimum and maximum values are market-dependent. Query `GET /api/v4/public/markets` for precision (`moneyPrec`).
          example: '40000'
        market:
          type: string
          description: 'Trading pair for the order. Format: `BASE_QUOTE` (e.g., `BTC_USDT`).'
          example: BTC_USDT
        postOnly:
          type: boolean
          default: false
          description: 'Post-only flag. When `true`, the order executes only as a maker order and is rejected if it would match immediately. Allowed only when `bboRole` is not set. Do not combine with `rpi=true` — RPI items apply post-only behavior automatically, and an item setting both flags fails validation. Default: `false`.'
          example: false
        ioc:
          type: boolean
          default: false
          description: 'Immediate-or-cancel (IOC) executes all or part of an order immediately and cancels any unfilled portion. Default: `false`.


            IOC does not support `rpi=true` because RPI uses post-only behavior by design.

            The API returns error code `40` when an order item sets both `ioc=true` and `rpi=true`.

            IOC cannot be combined with `postOnly=true` (error code `37`), and with `bboRole` it is allowed only for the Counterparty method (`2`).

            '
          example: false
        clientOrderId:
          type: string
          description: Custom client order identifier. Uniqueness is enforced only among the account's open (pending) orders on the same market — once a previous order is filled or canceled, the same identifier can be reused, including on the same market. Contains only letters, numbers, dashes, dots, or underscores.
          example: ''
        bboRole:
          type: integer
          enum:
          - 1
          - 2
          description: 'Best Bid/Offer ([BBO](/glossary#best-bid-offer-bbo)) execution method for the item. The system selects the best market price for execution. `1` = Queue method, `2` = Counterparty method.


            When `bboRole` is set, the item''s `price` is not required — the BBO method determines the execution price. `postOnly` is allowed only when `bboRole` is not set; `ioc` can be combined only with the Counterparty method (`2`).

            '
        stp:
          type: string
          enum:
          - 'no'
          - cb
          - cn
          - co
          default: 'no'
          description: 'Self-trade prevention mode for the item. Allowed values: `no` (self-trades allowed), `cb` (cancel both the new and the existing order), `cn` (cancel the new order, keep the existing), `co` (cancel the existing order, place the new one). Default: `no`.


            Legacy values `cancel_both`, `cancel_new`, `cancel_old` are deprecated: the API accepts the legacy values with identical behavior until a deprecation deadline is announced, then rejects the legacy values. Responses always return the abbreviated form, regardless of which variant the request used.


            See [Self-Trade Prevention](/platform/self-trade-prevention).

            '
          example: 'no'
        rpi:
          type: boolean
          default: false
          description: 'Enables Retail Price Improvement (RPI) mode. Default: `false`.


            RPI items apply post-only behavior automatically — do not also send an explicit `postOnly=true`: an item combining the two flags fails validation. An RPI order does not support `ioc=true`.

            The API returns error code `40` when an order item sets both `rpi=true` and `ioc=true`.

            '
          example: true
        retail:
          type: boolean
          default: false
          description: 'Retail-source taker flag for the bulk-order item. When `true`, the item is eligible to match against orders submitted by RPI makers and may receive price improvement at execution. Default: `false`.


            The Retail flag must be enabled on the account before a private-API request can set `retail=true`. Contact the account manager to enable the Retail flag.


            The flag has no effect on a `postOnly=true` or `rpi=true` item. Post-only and RPI orders are [makers](/glossary#maker); only takers carry the retail designation. An item with both `rpi=true` and `retail=true` matches exactly like an RPI order.


            Refer to [Retail flag](/glossary#retail-flag) and [Order Parameter Rules](/guides/order-parameter-rules) for unsupported parameter combinations.

            '
          example: false
    OrderHistoryStatus:
      type: string
      description: Order status returned by this endpoint, in uppercase. `FILLED` — fully executed. `CANCELED` — canceled before full execution; the endpoint also returns `AUTO_CANCELED_MARGIN_EXCHANGE_BALANCE` (order auto-canceled on insufficient margin or exchange balance) collapsed into `CANCELED`. `AUTO_CANCELED_LIQUIDATION` — auto-canceled because the associated position was force-liquidated. `AUTO_CANCELED_REDUCE_ONLY` — pending reduce-only order auto-canceled because the associated position was closed. `CANCELED_STP` — canceled by [Self-Trade Prevention](/platform/self-trade-prevention). `MAINTENANCE` — canceled by the platform when the market entered planned maintenance; never collapsed into `CANCELED`, so an integration that treats cancellations as user-initiated must handle this value separately. This endpoint returns a narrower, uppercase status set than the account's other order surfaces.
      enum:
      - FILLED
      - CANCELED
      - AUTO_CANCELED_LIQUIDATION
      - AUTO_CANCELED_REDUCE_ONLY
      - CANCELED_STP
      - MAINTENANCE
