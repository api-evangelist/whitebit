  /api/v4/collateral-account/adl-quantile:
    post:
      summary: ADL Quantile
      operationId: getCollateralAccountAdlQuantile
      description: 'The endpoint returns the Auto-Deleveraging (ADL) quantile for each perpetual market in which the authenticated account holds an open position. Each entry exposes the deleveraging-priority value for the long and short sides of the position, where `0` indicates the lowest deleveraging priority and `4` indicates the highest. The endpoint returns an empty array when the account has no perpetual positions.


        Rate limit: 12000 requests/10 sec.


        Only perpetual markets (markets with the `_PERP` suffix) are returned. Spot and margin markets are not included.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: Successful response — returns array of per-market ADL quantile entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    market:
                      type: string
                      description: 'Perpetual market name. Format: `BASE_PERP`.'
                      example: BTC_PERP
                    long:
                      type:
                      - integer
                      - 'null'
                      minimum: 0
                      maximum: 4
                      description: 'ADL quantile for the long side of the position. Values range from `0` to `4`: `0` indicates the lowest deleveraging priority (safest position in the ADL queue); `4` indicates the highest probability of being selected as the ADL counterparty. The value is `null` when the account has no exposure on the long side.'
                      example: 0
                    short:
                      type:
                      - integer
                      - 'null'
                      minimum: 0
                      maximum: 4
                      description: 'ADL quantile for the short side of the position. Values range from `0` to `4`: `0` indicates the lowest deleveraging priority; `4` indicates the highest probability of being selected as the ADL counterparty. The value is `null` when the account has no exposure on the short side.'
                      example: null
              example:
              - market: BTC_PERP
                long: 0
                short: null
              - market: ETH_PERP
                long: 2
                short: 1
        '422':
          description: Inner validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/conditional-orders:
    post:
      summary: Query unexecuted(active) conditional orders
      operationId: getConditionalOrders
      description: 'The endpoint returns active (unexecuted) conditional orders for the authenticated account. Conditional orders include OCO and OTO types. The response uses polymorphic structure — each record contains a `type` field (`oco` or `oto`) that determines the record shape. Use the optional `market` parameter to filter results.


        Rate limit: 12000 requests/10 sec.'
      tags:
