components:
  schemas:
    OrderStatus:
      type: string
      description: Order lifecycle status. `FILLED` — fully executed. `CANCELED` — canceled before execution. `PARTIALLY_FILLED` — partially executed, remainder still active. `CANCELED_TAKER_BAND` — partially filled up to the taker band limit, remainder canceled to protect against excessive order book slippage. `AUTO_CANCELED_REDUCE_ONLY` — pending reduce-only order auto-canceled because the associated position was closed. `AUTO_CANCELED_LIQUIDATION` — pending order auto-canceled because the associated position was force-liquidated. `CANCELED_STP` — order canceled by [Self-Trade Prevention](/platform/self-trade-prevention). REST returns the single-`L` spelling throughout; `NEW` and `PARTIAL_FILLED` are not REST values (`NEW` is WebSocket-only; the partially-filled state is `PARTIALLY_FILLED`).
      example: FILLED
    OcoOrderLeg:
      type: object
      description: OCO order leg as returned by `/api/v4/oco-orders` and `/api/v4/order/oco-cancel`. Field names use snake_case (`post_only`, `activation_price`) — unlike the camelCase legs returned by `/api/v4/conditional-orders`.
      properties:
        orderId:
          type: integer
          description: Order identifier
          example: 117703764514
        clientOrderId:
          type: string
          description: Custom order identifier. Empty string if not specified
          example: ''
        market:
          type: string
          description: Market name
          example: BTC_USDT
        side:
          type: string
          description: Order side
          enum:
          - buy
          - sell
          example: buy
        type:
          type: string
          description: Order type
          example: margin stop limit
        timestamp:
          type: number
          description: Unix timestamp in seconds (UTC) of order creation, with microsecond precision.
          example: 1594605801.49815
        dealMoney:
          type: string
          description: Executed amount in money
          example: '0'
        dealStock:
          type: string
          description: Executed amount in stock
          example: '0'
        amount:
          type: string
          description: Order amount
          example: '2.241379'
        left:
          type: string
          description: Unexecuted amount in stock
          example: '2.241379'
        dealFee:
          type: string
          description: Executed fee by deal
          example: '0'
        post_only:
          type: boolean
          description: Post-only flag
          example: false
        feeAsset:
          type: string
          description: Currency ticker of the asset used to pay the trading fee. Omitted when empty.
          example: USDT
        status:
          type: string
          description: Order status (for example `OPEN` for an active leg, `CANCELED` after cancellation).
          example: OPEN
        stp:
          type: string
          description: 'Self-trade prevention mode. Possible values: `no`, `cb`, `cn`, `co`. Always returned in abbreviated form, even when the request used a legacy value.'
          example: 'no'
        positionSide:
          type: string
          description: Position side of the leg. Present on futures markets (`BOTH` in one-way mode, `LONG`/`SHORT` in hedge mode); omitted on margin-spot markets.
          enum:
          - LONG
          - SHORT
          - BOTH
          example: LONG
        reduceOnly:
          type: boolean
          description: Reduce-only flag. When `true`, the leg can only reduce or close an existing position.
          example: false
        mtime:
          type: number
          description: Unix timestamp in seconds (UTC), with microsecond precision, of the last time the matching engine modified the order.
          example: 1662478154.941582
        price:
          type: string
          description: Order price
          example: '19928.79'
        activation_price:
          type: string
          description: Activation price. Returned on the stop-loss leg
          example: '29928.79'
        activation_condition:
          type: string
          description: 'Trigger condition derived from `side` (response-only, cannot be overridden): `buy` → `gte`, `sell` → `lte`. Returned on the stop-loss leg.

            '
          enum:
          - gte
          - lte
          example: gte
        activated:
          type: integer
          description: Activation status (0 - not activated, 1 - activated). Returned on the stop-loss leg
          example: 0
    ConditionalOrderLeg:
      type: object
      description: Conditional-order leg as returned by `/api/v4/conditional-orders`. Field names use camelCase (`postOnly`, `activationPrice`) — unlike the snake_case legs returned by `/api/v4/oco-orders` and `/api/v4/order/oco-cancel`; do not treat the two shapes as interchangeable.
      properties:
        orderId:
          type: integer
          description: Order identifier
          example: 117703764514
        clientOrderId:
          type: string
          description: Custom order identifier. Empty string if not specified
          example: ''
        market:
          type: string
          description: Market name
          example: BTC_USDT
        side:
          type: string
          description: Order side
          enum:
          - buy
          - sell
          example: buy
        type:
          type: string
          description: Order type
          example: margin stop limit
        timestamp:
          type: number
          description: Unix timestamp in seconds (UTC) of order creation, with microsecond precision.
          example: 1594605801.49815
        dealMoney:
          type: string
          description: Executed amount in money
          example: '0'
        dealStock:
          type: string
          description: Executed amount in stock
          example: '0'
        amount:
          type: string
          description: Order amount
          example: '2.241379'
        left:
          type: string
          description: Unexecuted amount in stock
          example: '2.241379'
        dealFee:
          type: string
          description: Executed fee by deal
          example: '0'
        postOnly:
          type: boolean
          description: Post-only flag. Omitted when not set
          example: false
        status:
          type: string
          description: Order status (for example `OPEN` for an active leg, `CANCELED` after cancellation).
          example: OPEN
        stp:
          type: string
          description: 'Self-trade prevention mode. Possible values: `no`, `cb`, `cn`, `co`. Always returned in abbreviated form, even when the request used a legacy value. Omitted when not set.'
          example: 'no'
        positionSide:
          type: string
          description: Position side of the leg. Present on futures markets (`BOTH` in one-way mode, `LONG`/`SHORT` in hedge mode); omitted on margin-spot markets.
          enum:
          - LONG
          - SHORT
          - BOTH
          example: LONG
        reduceOnly:
          type: boolean
          description: Reduce-only flag. When `true`, the leg can only reduce or close an existing position.
          example: false
        mtime:
          type: number
          description: Unix timestamp in seconds (UTC), with microsecond precision, of the last time the matching engine modified the order.
          example: 1662478154.941582
        price:
          type: string
          description: Order price
          example: '19928.79'
        activationPrice:
          type: string
          description: Activation price. Returned on the stop-loss leg; omitted when not set
          example: '29928.79'
        activationCondition:
          type: string
          description: 'Trigger condition derived from `side` (response-only, cannot be overridden): `buy` → `gte`, `sell` → `lte`. Returned on the stop-loss leg; omitted when not set.

            '
          enum:
          - gte
          - lte
          example: gte
        activated:
          type: integer
          description: Activation status (0 - not activated, 1 - activated). Omitted when not set
          example: 0
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: Error code
          example: 30
        message:
          type: string
          description: Error message
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Detailed error information
    ActiveOrderStatus:
      type: string
      description: Order status. `FILLED` — fully executed. `PARTIALLY_FILLED` — partially executed, remainder still active. `CANCELED` — canceled before full execution. REST uses the single-`L` spelling `CANCELED`; the double-`L` `CANCELLED` and the WebSocket-only `NEW` state are not returned by this API.
      enum:
      - FILLED
      - PARTIALLY_FILLED
      - CANCELED
      example: FILLED
    OrderResponse:
      type: object
      description: Shared order shape returned by the order-creation, cancel, active-orders list, and modify endpoints. Field presence varies by endpoint and order type — see the per-field notes.
      properties:
        orderId:
          type: integer
          description: Unique identifier assigned to the order by the matching engine.
          example: 4180284841
        clientOrderId:
          type: string
          description: Custom client order identifier supplied in the request. Returns an empty string when not specified.
          example: order1987111
        market:
          type: string
          description: 'Trading pair for the order. Format: `BASE_QUOTE` (e.g., `BTC_USDT`).'
          example: BTC_USDT
        side:
          type: string
          description: 'Order side. Possible values: `buy`, `sell`.'
          example: buy
        type:
          type: string
          description: 'Order type. Possible values: `limit`, `market`, `stock market`, `stop limit`, `stop market`.'
          example: limit
        timestamp:
          type: number
          description: Unix timestamp in seconds (UTC) of order creation, with microsecond precision.
          example: 1595792396.165973
        dealMoney:
          type: string
          description: Filled amount in quote currency. Returns `"0"` while the order remains unfilled.
          example: '0'
        dealStock:
          type: string
          description: Filled amount in base currency. Returns `"0"` while the order remains unfilled.
          example: '0'
        amount:
          type: string
          description: Order quantity in base currency for limit and stop-limit orders, or in quote currency for buy market orders.
          example: '0.01'
        left:
          type: string
          description: Remaining unfilled quantity. Equals `amount` for new orders and `"0"` for fully filled orders.
          example: '0.001'
        dealFee:
          type: string
          description: Cumulative trading fee charged for filled portions, denominated in the fee asset.
          example: '0'
        feeAsset:
          type: string
          description: Currency ticker of the asset used to pay the trading fee. Omitted when empty.
          example: USDT
        price:
          type: string
          description: Limit price per unit in quote currency. Present for orders that carry a price (limit and stop-limit shapes); omitted on market and stop-market order shapes.
          example: '40000'
        postOnly:
          type: boolean
          description: Post-only flag. When `true`, the order executes only as a maker order and is rejected if it would match immediately. Omitted when not set.
          example: false
        ioc:
          type: boolean
          description: 'Immediate-or-cancel flag. When `true`, the order executes available quantity immediately and cancels the unfilled remainder. Default: `false`.'
          example: false
        status:
          $ref: '#/components/schemas/OrderStatus'
        stp:
          type: string
          description: 'Self-trade prevention mode applied to the order. Possible values: `no`, `cb`, `cn`, `co`. The response always returns the abbreviated form, even when the request used a legacy value. Default: `no`.'
          example: 'no'
        positionSide:
          type: string
          description: Position side (for collateral orders). Returned on the cancel, active-orders list, and modify responses; omitted when not set. Spot order-creation responses do not include the field.
          example: LONG
        oto:
          type: object
          description: OTO order data. Present only when the order belongs to an [OTO](/glossary#one-triggers-the-other-oto) group — returned on the cancel, active-orders list, and modify responses.
          properties:
            otoId:
              type: integer
              description: OTO order identifier
              example: 29457221
            takeProfit:
              type: string
              description: Take profit order price
              example: '50000'
            stopLoss:
              type: string
              description: Stop loss order price
              example: '30000'
        rpi:
          type: boolean
          description: Indicates Retail Price Improvement (RPI) mode for the order.
          example: true
        retail:
          type: boolean
          description: Retail-source taker flag. The field is present only when the order was placed with `retail=true`. See [Retail flag](/glossary#retail-flag).
          example: true
        reduceOnly:
          type: boolean
          description: Reduce-only flag. When `true`, the order can only reduce or close an existing position. Returned on the cancel, active-orders list, and modify responses; spot order-creation responses do not include the field. See [reduce-only](/glossary#reduce-only).
          example: false
        activated:
          type: integer
          description: Activation status of the stop order. 0 = not yet triggered (waiting for the activation_price condition to be met). 1 = triggered (the stop condition has been met and the order is now active). Returned for stop orders; omitted on other order shapes.
          example: 0
        activationCondition:
          type: string
          enum:
          - lte
          - gte
          description: 'Trigger condition for the stop order. Response-only — not accepted in the request body, and cannot be overridden. Derived from `side`:


            - `side = buy` → `gte`. The order activates when the market price rises to or above `activation_price`.

            - `side = sell` → `lte`. The order activates when the market price falls to or below `activation_price`.

            '
          example: lte
        activation_price:
          type: string
          description: The trigger price for the stop order. Always equals the activation_price value submitted in the request. Returned for stop orders; omitted on other order shapes.
          example: '40000'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-TXC-APIKEY
      description: The public WhiteBIT API key.
    PayloadAuth:
      type: apiKey
      in: header
      name: X-TXC-PAYLOAD
      description: Base64-encoded JSON request body.
    SignatureAuth:
      type: apiKey
      in: header
      name: X-TXC-SIGNATURE
      description: HMAC-SHA512 signature of the payload, hex-encoded. Computed as hex(HMAC-SHA512(payload, api_secret)).
