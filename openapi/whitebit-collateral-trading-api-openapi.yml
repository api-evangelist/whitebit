                items:
                  type: object
                  properties:
                    positionId:
                      type: integer
                      description: Position identifier
                      example: 111
                    market:
                      type: string
                      description: Position market
                      example: BTC_USDT
                    openDate:
                      type: number
                      description: Date of position opening in Unix timestamp format
                      example: 1650400589.882613
                    modifyDate:
                      type: number
                      description: Date of position modification (current event) in Unix timestamp format
                      example: 1650400589.882613
                    amount:
                      type: string
                      description: Position amount
                      example: '0.1'
                    basePrice:
                      type: string
                      description: Base price of position
                      example: '45658.349'
                    realizedFunding:
                      type: string
                      description: Funding fee for whole position lifetime till current state
                      example: '0'
                    liquidationPrice:
                      type:
                      - string
                      - 'null'
                      description: Liquidation price according to current state of position
                      example: null
                    liquidationState:
                      type:
                      - string
                      - 'null'
                      description: State of liquidation
                      enum:
                      - margin_call
                      - liquidation
