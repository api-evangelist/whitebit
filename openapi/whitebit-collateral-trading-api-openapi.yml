                nonce:
                  type: integer
                  example: 1594297865000
            example:
              market: BTC_USDT
              offset: 0
              limit: 100
      responses:
        '200':
          description: Successful response - returns paginated conditional orders (OCO and OTO types)
          content:
            application/json:
              schema:
                type: object
                properties:
