  /api/v4/order/collateral/oco:
    post:
      summary: Create collateral OCO order
      operationId: createCollateralOcoOrder
      description: 'The endpoint creates a collateral OCO (one-cancels-the-other) order using collateral balance. An OCO order combines a limit order (take-profit leg) and a stop-limit order (stop-loss leg) into a single conditional group. When one leg executes, the system cancels the other automatically.


        **Price and amount steps:** from September 18, 2026, `price`, `activation_price` and `stop_limit_price` must be multiples of the market `tickSize`, and `amount` a multiple of `stepSize`. See Price and amount steps.


        Rate limit: 10000 requests/10 sec.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - side
              - amount
              - price
              - activation_price
              - stop_limit_price
              - request
              - nonce
              properties:
                market:
                  type: string
                  description: 'Available margin [market](/glossary#market). Example: BTC_USDT'
                  example: BTC_USDT
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                  description: Order direction. Use `buy` to open or increase a long position and `sell` to open or increase a short position.
                  example: buy
                amount:
                  type: string
                  description: Amount of [stock](/glossary#stock) currency for both legs of the OCO order. Minimum and step values are market-dependent — query the [market info](/api-reference/market-data/market-info) endpoint for constraints.
                  example: '0.001'
                price:
                  type: string
                  description: Limit order price in [money](/glossary#money) currency for the take-profit leg.
                  example: '40000'
                activation_price:
                  type: string
                  description: Trigger price in [money](/glossary#money) currency for the stop-loss leg. The stop-limit order activates when the market price reaches the specified value.
                  example: '41000'
                stop_limit_price:
                  type: string
                  description: Execution price in [money](/glossary#money) currency for the stop-loss leg. After activation, the stop-loss leg places a limit order at the specified price.
                  example: '42000'
                clientOrderId:
                  type: string
                  description: Custom client order identifier. Uniqueness is enforced only among the account's open (pending) orders on the same market — once a previous order is filled or canceled, the same identifier can be reused, including on the same market. Contains only letters, numbers, dashes, dots, or underscores.
                  example: order1987111
                reduceOnly:
                  type: boolean
                  default: false
                  description: When `true`, both legs of the OCO order can only reduce or close an existing position — neither leg can increase the position or open a new one. If the order amount exceeds the current position size, the system reduces the order to match — the response returns the adjusted amount. The API returns error code `116` if no open position exists or the order side matches the position direction. See [reduce-only](/glossary#reduce-only).
                  example: false
                positionSide:
                  type: string
                  enum:
                  - LONG
                  - SHORT
                  - BOTH
                  description: 'Position direction. Optional at the request layer but functionally required when hedge mode is enabled. See [positionSide](/glossary#position-side). Both legs of the OCO inherit the value.


                    - **One-way mode** (default account mode): the field is ignored. Orders always use `BOTH`, and the response returns `positionSide: "BOTH"` on each leg whether the field is sent or omitted.

                    - **Hedge mode**: the field MUST be `LONG` or `SHORT`. Sending `BOTH`, omitting the field, or sending a value that does not match the account''s mode causes the trade service to reject the order with error code `114` (`Hedge mode position side does not match`).

                    '
                  example: LONG
                stp:
                  type: string
                  enum:
                  - 'no'
                  - cb
                  - cn
                  - co
                  default: 'no'
                  description: 'Self-trade prevention mode. The value applies to both legs of the OCO order. Allowed values: `no` (self-trades allowed), `cb` (cancel both the new and the existing order), `cn` (cancel the new order, keep the existing), `co` (cancel the existing order, place the new one). Default: `no`.


                    Legacy values `cancel_both`, `cancel_new`, `cancel_old` are deprecated: the API accepts the legacy values with identical behavior until a deprecation deadline is announced, then rejects the legacy values. Responses always return the abbreviated form, regardless of which variant the request used.


                    See [Self-Trade Prevention](/platform/self-trade-prevention).

                    '
                  example: 'no'
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              market: BTC_USDT
              side: buy
              amount: '0.001'
              price: '40000'
              activation_price: '41000'
              stop_limit_price: '42000'
              clientOrderId: order1987111
              reduceOnly: false
              positionSide: LONG
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: Successful response - OCO order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: OCO order identifier
                    example: 117703764513
                  reduceOnly:
                    type: boolean
                    description: Reduce-only flag
                    example: false
                  stop_loss:
                    type: object
                    description: Stop loss order details
                    properties:
                      orderId:
                        type: integer
                        description: Order identifier
                        example: 117703764514
                      clientOrderId:
                        type: string
                        description: Custom order identifier. Empty string if not specified
                        example: ''
                      market:
                        type: string
                        description: Market name
                        example: BTC_USDT
                      side:
                        type: string
                        description: Order side
                        enum:
                        - buy
                        - sell
                        example: buy
                      type:
                        type: string
                        description: Order type
                        example: stop limit
                      timestamp:
                        type: number
                        description: Unix timestamp in seconds (UTC) of order creation, with microsecond precision.
                        example: 1594605801.49815
                      dealMoney:
                        type: string
                        description: Executed amount in money
                        example: '0'
                      dealStock:
                        type: string
                        description: Executed amount in stock
                        example: '0'
                      amount:
                        type: string
                        description: Order amount
                        example: '2.241379'
                      takerFee:
                        type: string
                        description: Taker fee ratio
                        example: '0.001'
                      makerFee:
                        type: string
                        description: Maker fee ratio
                        example: '0.001'
                      left:
                        type: string
                        description: Unexecuted amount in stock
                        example: '2.241379'
                      dealFee:
                        type: string
                        description: Executed fee by deal
                        example: '0'
                      post_only:
                        type: boolean
                        description: Post-only flag
                        example: false
                      mtime:
                        type: number
                        description: Unix timestamp in seconds (UTC), with microsecond precision, of the last time the matching engine modified the order.
                        example: 1662478154.941582
                      price:
                        type: string
                        description: Order price
                        example: '19928.79'
                      activation_price:
                        type: string
                        description: Activation price
                        example: '29928.79'
                      activation_condition:
                        type: string
                        description: 'Trigger condition derived from `side` (response-only, cannot be overridden): `buy` → `gte`, `sell` → `lte`.

                          '
                        enum:
                        - gte
                        - lte
                        example: gte
                      activated:
                        type: integer
                        description: Activation status (0 - not activated, 1 - activated)
                        example: 0
                      status:
                        type: string
                        $ref: '#/components/schemas/ActiveOrderStatus'
                      stp:
                        type: string
                        description: 'Self-trade prevention mode. Possible values: `no`, `cb`, `cn`, `co`. Always returned in abbreviated form, even when the request used a legacy value.'
                        example: 'no'
                      positionSide:
                        type: string
                        description: Position side
                        enum:
                        - LONG
                        - SHORT
                        - BOTH
                        example: LONG
                  take_profit:
                    type: object
                    description: Take profit order details
                    properties:
                      orderId:
                        type: integer
                        description: Order identifier
                        example: 117703764515
                      clientOrderId:
                        type: string
                        description: Custom order identifier. Empty string if not specified
                        example: ''
                      market:
                        type: string
                        description: Market name
                        example: BTC_USDT
                      side:
                        type: string
                        description: Order side
                        enum:
                        - buy
                        - sell
                        example: buy
                      type:
                        type: string
                        description: Order type
                        example: limit
                      timestamp:
                        type: number
                        description: Unix timestamp in seconds (UTC) of order creation, with microsecond precision.
                        example: 1662478154.941582
                      dealMoney:
                        type: string
                        description: Executed amount in money
                        example: '0'
                      dealStock:
                        type: string
                        description: Executed amount in stock
                        example: '0'
                      amount:
                        type: string
                        description: Order amount
                        example: '0.635709'
                      takerFee:
                        type: string
                        description: Taker fee ratio
                        example: '0.001'
                      makerFee:
                        type: string
                        description: Maker fee ratio
                        example: '0.001'
                      left:
                        type: string
                        description: Unexecuted amount in stock
                        example: '0.635709'
                      dealFee:
                        type: string
                        description: Executed fee by deal
                        example: '0'
                      post_only:
                        type: boolean
                        description: Post-only flag
                        example: false
                      mtime:
                        type: number
                        description: Unix timestamp in seconds (UTC), with microsecond precision, of the last time the matching engine modified the order.
                        example: 1662478154.941582
                      price:
                        type: string
                        description: Order price
                        example: '9928.79'
                      status:
                        type: string
                        $ref: '#/components/schemas/ActiveOrderStatus'
                      stp:
                        type: string
                        description: 'Self-trade prevention mode. Possible values: `no`, `cb`, `cn`, `co`. Always returned in abbreviated form, even when the request used a legacy value.'
                        example: 'no'
                      positionSide:
                        type: string
                        description: Position side
                        enum:
                        - LONG
                        - SHORT
                        - BOTH
                        example: LONG
              example:
                id: 117703764513
                reduceOnly: false
                stop_loss:
                  orderId: 117703764514
                  clientOrderId: ''
                  market: BTC_USDT
                  side: buy
                  type: stop limit
                  timestamp: 1594605801.49815
                  dealMoney: '0'
                  dealStock: '0'
                  amount: '2.241379'
                  takerFee: '0.001'
                  makerFee: '0.001'
                  left: '2.241379'
                  dealFee: '0'
