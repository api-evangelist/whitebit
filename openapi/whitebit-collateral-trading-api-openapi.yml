                  mtime: 1662478154.941582
                  price: '19928.79'
                  activation_price: '29928.79'
                  activation_condition: gte
                  activated: 0
                  status: FILLED
                  stp: 'no'
                  positionSide: LONG
                take_profit:
                  orderId: 117703764515
                  clientOrderId: ''
                  market: BTC_USDT
