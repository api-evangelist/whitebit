                          type: string
                          description: Trade amount of order
                          example: '0.1'
                        price:
                          type: string
                          description: Order price
                          example: '41507.59'
                        tradeFee:
                          type: string
                          description: Order trade fee
                          example: '415.07'
                        fundingFee:
                          type:
                          - string
                          - 'null'
                          description: Funding fee captured by this position change
                          example: null
                        realizedPnl:
                          type:
                          - string
                          - 'null'
                          description: Realized profit and loss
                          example: null
                    side:
                      type: string
                      enum:
                      - LONG
                      - SHORT
                      - BOTH
                      description: Position direction. `BOTH` indicates a one-way mode position; `LONG` or `SHORT` indicates a hedge mode position. See [position side](/glossary#position-side).
                      example: LONG
                    isHedge:
                      type: boolean
                      description: Indicates whether [hedge mode](/glossary#hedge-mode) was active when the position was opened. Hedge-mode toggling requires zero open positions, so the value also reflects the account mode at every event in the position's lifetime.
                      example: false
              example:
