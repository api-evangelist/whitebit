  /api/v4/collateral-account/hedge-mode/update:
    post:
      summary: Update Collateral Account Hedge Mode
      operationId: updateHedgeMode
      description: 'The endpoint enables or disables hedge mode for the collateral trading account. When hedge mode is enabled (`true`), the account supports simultaneous long and short positions on the same market. When disabled (`false`), the account operates in one-way mode.


        Rate limit: 1000 requests/10 sec.


        Switching between one-way mode and hedge mode requires **no open positions**. Close all futures positions before toggling the mode. If the switch does not take effect immediately after closing positions, wait approximately 15 seconds and retry.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hedgeMode
              - request
              - nonce
              properties:
                hedgeMode:
                  type: boolean
                  description: Set to `true` to enable hedge mode (simultaneous long and short positions) or `false` to use one-way mode.
                  example: true
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
