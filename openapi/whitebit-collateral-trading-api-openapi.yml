        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market:
                  type: string
                  description: 'Filter by specific market. Example: BTC_USDT


                    If not specified, returns conditional orders for all markets.

                    '
                  example: BTC_USDT
                offset:
                  type: integer
                  description: Number of records to skip for pagination.
                  default: 0
                  minimum: 0
                  maximum: 4294967295
                  example: 0
