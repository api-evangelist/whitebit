    post:
      summary: Cancel conditional order
      operationId: cancelConditionalOrder
      description: 'The endpoint cancels an active conditional order (OCO or OTO) on the specified market. Both legs of the conditional order are cancelled. Use the query unexecuted conditional orders endpoint to obtain the conditional order `id` before cancellation.


        Rate limit: 10000 requests/10 sec.'
