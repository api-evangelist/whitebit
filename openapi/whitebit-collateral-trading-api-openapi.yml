      description: 'The endpoint returns the history of collateral position state changes for the authenticated account. Each record represents a position event (open, partial close, full close, or liquidation) and includes the order details that triggered the change. Use the optional `market` and `positionId` parameters to filter results.


        Rate limit: 12000 requests/10 sec.


        **Date filter window:** `startDate` and `endDate` are optional and have no defaults. The endpoint enforces no maximum window and no lower-bound floor. The only ordering constraint is `startDate` ≤ `endDate` ≤ `now + 1s` — requests that violate the ordering are rejected with a validation error.


        **Breaking change — April 29, 2026.** The `positionSide` field is no longer returned in the Position History response. Use `side` (same enum: `LONG`, `SHORT`, `BOTH`) plus `isHedge` (boolean) instead. Integrations reading `positionSide` from `/api/v4/collateral-account/positions/history` must migrate before consuming the new response.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market:
                  type: string
                  description: 'Filter by specific market. Example: BTC_USDT


                    If not specified, returns position history for all markets.

                    '
                  example: BTC_USDT
                positionId:
                  type: integer
                  description: Filter by specific position identifier. If not specified, returns history for all positions.
                  example: 1
                startDate:
                  type: integer
                  description: Start of the query window as a Unix timestamp in seconds. Optional, no default. Must be ≤ `endDate`.
                  example: 1650400000
                endDate:
                  type: integer
                  description: End of the query window as a Unix timestamp in seconds. Optional, no default. Must be ≥ `startDate` and ≤ `now + 1s`; violating values are rejected with a validation error.
                  example: 1650500000
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              market: BTC_USDT
              positionId: 1
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: Successful response - returns array of position history
          content:
            application/json:
              schema:
