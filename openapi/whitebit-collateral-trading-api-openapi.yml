  /api/v4/collateral-account/positions/closed-pnl:
    post:
      summary: Closed-position PNL
      operationId: getClosedPositionsPnl
      description: 'The endpoint returns one aggregated profit-and-loss record per closed collateral position for the authenticated account — the same closed-position PNL the trading terminal shows. Records are sorted by `closeDate` descending, then `positionId` descending. Use the optional `startDate` and `endDate` parameters to narrow the window; the filter applies to the position close time.


        The endpoint supports pagination via `limit` (default: 50, max: 100) and `offset` (default: 0); the sum of `offset` and `limit` must not exceed 10000. A response that returns fewer than `limit` records indicates the last page.


        **Close-time windowing:** a position opened before the requested window but closed inside the window returns complete aggregates — fees, average prices, and closed size cover the full position lifetime, not only the requested window.


        Rate limit: 12000 requests/10 sec.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: integer
                  description: Start of the query window as a Unix timestamp in seconds, applied to the position close time. Optional, no default. Must be ≤ `endDate`.
                  example: 1778000000
                endDate:
                  type: integer
                  description: End of the query window as a Unix timestamp in seconds, applied to the position close time. Optional, no default. Must be ≥ `startDate` and ≤ `now + 1s`.
                  example: 1778100000
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
                  description: 'Maximum number of records to return. Default: `50`. Minimum: `1`. Maximum: `100`.'
                  example: 50
                offset:
                  type: integer
                  minimum: 0
                  default: 0
                  description: 'Number of records to skip. Default: `0`. The sum of `offset` and `limit` must not exceed 10000.'
                  example: 0
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              startDate: 1778000000
              endDate: 1778100000
              limit: 50
              offset: 0
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: Successful response - returns an array with one aggregated record per closed position, sorted by `closeDate` descending, then `positionId` descending. Returns an empty array when no closed positions match the filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    positionId:
                      type: integer
                      description: Unique identifier of the closed position.
                      example: 111
                    market:
                      type: string
                      description: 'Market of the position. Format: `BASE_QUOTE`.'
                      example: BTC_USDT
                    grossPnl:
                      type: string
                      description: Realized profit and loss of the position before funding. Trading fees are already deducted from the value; `totalTradeFee` is informational and must not be subtracted again.
                      example: '43.85'
                    netPnl:
                      type: string
                      description: 'Net profit and loss of the position: `grossPnl` minus `totalFunding`.'
                      example: '42.6'
                    totalTradeFee:
                      type: string
                      description: Sum of trading fees across all fills of the position, both opening and closing. Informational — already reflected in `grossPnl` and `netPnl`.
                      example: '6.15'
                    totalFunding:
                      type: string
                      description: Cumulative funding fee over the whole position lifetime.
                      example: '1.25'
                    avgEntryPrice:
                      type: string
                      description: Volume-weighted average price of the fills that increased the position, trimmed to the market money precision.
                      example: '61000'
                    avgExitPrice:
                      type: string
                      description: Volume-weighted average price of the fills that reduced the position, trimmed to the market money precision.
                      example: '62000'
                    closedSize:
                      type: string
                      description: Total closed volume in base currency — the sum of fills that reduced the position.
                      example: '0.05'
                    amount:
                      type: string
                      description: Remaining position size. Always returns `"0"` — a closed position holds no size.
                      example: '0'
                    side:
                      type: string
                      enum:
                      - LONG
                      - SHORT
                      - BOTH
                      description: Position direction. Returns `BOTH` for positions opened with hedge mode disabled. See [positionSide](/glossary#position-side).
                      example: LONG
                    isHedge:
                      type: boolean
                      description: Whether the position was opened in [hedge mode](/glossary#hedge-mode).
                      example: true
                    openDate:
                      type: integer
                      description: Position open time as a Unix timestamp in seconds.
                      example: 1778000000
                    closeDate:
                      type: integer
                      description: Position close time as a Unix timestamp in seconds. Primary sort key, descending.
                      example: 1778077400
              example:
              - positionId: 111
                market: BTC_USDT
                grossPnl: '43.85'
                netPnl: '42.6'
                totalTradeFee: '6.15'
                totalFunding: '1.25'
                avgEntryPrice: '61000'
                avgExitPrice: '62000'
                closedSize: '0.05'
                amount: '0'
                side: LONG
                isHedge: true
                openDate: 1778000000
                closeDate: 1778077400
              - positionId: 98
                market: ETH_USDT
                grossPnl: '-82.425'
                netPnl: '-83.225'
                totalTradeFee: '7.425'
                totalFunding: '0.8'
                avgEntryPrice: '2500'
                avgExitPrice: '2450'
                closedSize: '1.5'
                amount: '0'
                side: BOTH
                isHedge: false
                openDate: 1777900000
                closeDate: 1778050000
        '400':
          description: 'Inner validation failed


            Error codes:

            - `30` - default validation error code (invalid pagination — `limit` outside 1–100, or `offset` + `limit` above 10000 — or a date filter that violates `startDate` ≤ `endDate` ≤ `now + 1s`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
        '503':
          description: Service temporarily unavailable
  /api/v4/collateral-account/funding-history:
    post:
      summary: Funding History
      operationId: getFundingHistory
      description: 'The endpoint returns the funding rate payment history for collateral positions. Each record includes the funding rate, settlement price, position amount, and the resulting funding payment. The `market` parameter is required — the endpoint returns funding for one market per request and has no all-markets mode. The response supports pagination via `limit` and `offset` parameters. Results are ordered by funding time (`fundingTime`), newest first.


        Rate limit: 12000 requests/10 sec.


        This endpoint supports pagination. Use `limit` (default: 100) and `offset` (default: 0) to page through results. The response does not include a `total` field — detect the last page when you receive fewer than `limit` records. When nothing matches, the response omits the `records` key entirely rather than returning an empty array, so check that the key is present before reading it. Receiving exactly `limit` records does not guarantee that another page exists.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - request
              - nonce
              properties:
                market:
                  type: string
                  description: 'Market to return funding history for. For example: BTC_PERP


                    Required — there is no all-markets mode. Spot markets are rejected.

                    '
                  example: BTC_PERP
                limit:
                  type: integer
                  description: Number of records to return
                  example: 100
                  default: 100
                offset:
                  type: integer
                  description: Number of records to skip
                  example: 0
                  default: 0
                request:
                  type: string
                  description: Request signature
                  example: '{{request}}'
                nonce:
                  type: integer
                  description: Unique request identifier
                  example: 1594297865000
            example:
              market: BTC_PERP
              limit: 100
              offset: 0
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: Successful response - returns paginated funding history
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    description: Array of funding history entries
                    items:
                      type: object
                      properties:
                        market:
                          type: string
                          description: Market name
                          example: BTC_PERP
                        fundingTime:
                          type: string
                          description: Funding time in Unix timestamp format
                          example: '1734451200'
                        fundingRate:
                          type: string
                          description: Funding rate applied
                          example: '0.00017674'
                        fundingAmount:
                          type: string
                          description: Funding amount paid or received
                          example: '-0.171053531892'
                        positionAmount:
                          type: string
                          description: Position amount at funding time
                          example: '0.019'
                        settlementPrice:
                          type: string
                          description: Settlement price used for funding calculation
                          example: '50938.2'
                        rateCalculatedTime:
                          type: string
                          description: Time when the funding rate was calculated in Unix timestamp format
                          example: '1734364800'
                  limit:
                    type: integer
                    description: Number of records per page
                    example: 100
                  offset:
                    type: integer
                    description: Number of records skipped
                    example: 0
              example:
                records:
                - market: BTC_PERP
                  fundingTime: '1734451200'
                  fundingRate: '0.00017674'
                  fundingAmount: '-0.171053531892'
                  positionAmount: '0.019'
                  settlementPrice: '50938.2'
                  rateCalculatedTime: '1734364800'
                - market: BTC_PERP
                  fundingTime: '1734451200'
                  fundingRate: '-0.000177877800093587'
                  fundingAmount: '-0.0054997859133136'
                  positionAmount: '-0.001'
                  settlementPrice: '30918.9'
                  rateCalculatedTime: '1734364800'
                limit: 100
                offset: 0
        '422':
          description: 'Inner validation failed


            Error codes:

            - `30` - default validation error code (invalid pagination — `limit` outside 1–100 or negative `offset`)

            - `31` - market validation failed — either `market` was omitted (`"The Market field is required."`) or it is unknown / not available for collateral trading, e.g. a spot market (`"Incorrect market"`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/collateral-account/borrow-history:
    post:
      summary: Borrow History
      operationId: getBorrowHistory
      description: 'The endpoint returns the collateral account''s borrow history for the authenticated account — one record per borrow position, not per underlying engine state change. Use the optional `asset` parameter to filter to a single asset; when omitted, the response covers every asset the caller''s region allows to borrow. An `asset` that is unknown or blocked in the caller''s region returns a validation error rather than an empty result. Records are ordered by creation time descending (newest first). Records created in the same second are ordered by `asset` ascending, then by the trading engine''s sub-second creation time descending; `limit` and `offset` page over this order.


        Rate limit: 12000 requests/10 sec.


        This endpoint supports pagination via `limit` (default and max: 100) and `offset` (default: 0, max: 10000 — a value above the maximum is rejected outright). `startTime` (default: `0`) and `endTime` (default: now) filter by position time and must satisfy `endTime` > `startTime`. Independently of `offset`, a `startTime`/`endTime` window is rejected rather than scanned slowly or served partially when collecting the matching history would exceed the endpoint''s budget of 10000 underlying engine records. One position spans several engine records, so that budget is reached well below 10000 positions — narrow the window instead.


        **Field semantics:** `amount`, `principal` and `interest` are independently computed peak values, not a running formula — `amount` does not always equal `principal` + `interest`, because funding can keep accruing after a position''s balance has already peaked. Treat any apparent `amount = principal + interest` relationship as usually true, never as a guarantee.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset:
                  type: string
                  description: Filter to a single asset. Optional — when omitted or empty, returns borrow history for every asset the caller's region allows to borrow. An unknown or region-blocked asset returns a validation error.
                  example: BTC
                startTime:
                  type: integer
                  description: Start of the query window as a Unix timestamp in seconds. Optional, default `0`. Must be less than `endTime`.
                  example: 1700000000
                endTime:
                  type: integer
                  description: 'End of the query window as a Unix timestamp in seconds. Optional, default: now. Must be greater than `startTime`.'
                  example: 1700100000
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 100
                  description: 'Maximum number of records to return. Default: `100`. Minimum: `1`. Maximum: `100`.'
                  example: 100
                offset:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  default: 0
                  description: 'Number of borrow positions to skip. Paging applies after engine state changes are grouped into positions, so page boundaries do not follow the count of underlying engine records. Default: `0`. Maximum: `10000`.'
                  example: 0
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              asset: BTC
              startTime: 1700000000
              endTime: 1700100000
              limit: 100
              offset: 0
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: Successful response - returns paginated borrow history. `records` is an empty array, not omitted, when nothing matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    description: One entry per borrow position, not per underlying engine state change.
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          description: Borrowed asset.
                          example: BTC
                        amount:
                          type: string
                          description: Peak total amount owed to the engine for the position, already including accrued funding. Not always equal to `principal` + `interest` — see the field-semantics note above.
                          example: '108.32'
                        principal:
                          type: string
                          description: Peak borrowed balance, excluding funding accrued in the position at that point.
                          example: '100'
                        interest:
                          type: string
                          description: Magnitude of realized funding on the position.
                          example: '6.15'
                        status:
                          type: string
                          enum:
                          - active
                          - repaid
                          - liquidated
                          description: State of the borrow position within the requested `startTime`/`endTime` window. `repaid` and `liquidated` are reported only when the records returned for that position include one that moved the borrowed principal — `liquidated` when the outstanding balance reached zero through the risk engine, `repaid` when it reached zero by any other route. A position whose returned records hold only funding accruals or discounts stays `active` even when the outstanding balance nets to zero.
                          example: active
                        timestamp:
                          type: integer
                          description: Unix timestamp in seconds of the borrow position's open time — not of any later state change on the position. Positions are grouped with sub-second precision while this field is truncated to whole seconds, so two positions in the same asset opened within one second are returned as separate records carrying the same `timestamp`.
                          example: 1700000000
                  limit:
                    type: integer
                    description: The `limit` applied to this response — the request's `limit`, or `100` when the request omitted the field.
                    example: 100
                  offset:
                    type: integer
                    description: Echoes the request's `offset`.
                    example: 0
              example:
                records:
                - asset: BTC
                  amount: '108.32'
                  principal: '100'
                  interest: '6.15'
                  status: active
                  timestamp: 1700000000
                limit: 100
                offset: 0
        '400':
          description: 'Inner validation failed


            Error codes:

            - `30` - default validation error code (`asset` unknown or not available in the caller''s region, invalid pagination, or `endTime` not strictly greater than `startTime`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Request validation failed


            Error codes:

            - `30` - collecting the requested window would exceed the endpoint''s budget of 10000 underlying engine records (tag: `startTime`); narrow `startTime`/`endTime` instead. Paging with `offset` does not help — the rejection happens while the history is being collected, before `offset` is applied

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
        '503':
          description: Service temporarily unavailable
  /api/v4/collateral-account/leverage:
    post:
      summary: Change Collateral Account Leverage
      operationId: changeCollateralAccountLeverage
      description: 'The endpoint changes the leverage level for the collateral trading account. Leverage determines the ratio of borrowed funds to collateral and directly affects margin requirements and liquidation thresholds. Accepted values: `1`, `2`, `3`, `5`, `10`, `20`, `50`, `100`.


        Each leverage level has a corresponding bracket defining the maximum position size for the tier. When a position exceeds the bracket limit, the system applies higher tiers with progressively lower leverage. Query market-specific brackets via `GET /api/v4/public/futures`.


        Rate limit: 1000 requests/10 sec.


        A market''s `max_leverage` field (from `GET /api/v4/public/futures`) may be lower than `100`. Setting leverage above a market''s maximum results in an error.


        Coming soon: the maximum accepted `leverage` can be lower than `100` for an account due to trading restrictions. A value above the account''s maximum is rejected with `422` and error code `30` on `leverage`. Leverage already set above the new maximum stays in effect until the next change.


        Changing leverage affects **all open positions** across margin and futures trading. Decreasing leverage increases margin requirements — if available funds are insufficient to support the new level, the request returns an error.'
      tags:
      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - leverage
              - request
              - nonce
              properties:
                leverage:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 'Target leverage level: `1`, `2`, `3`, `5`, `10`, `20`, `50` or `100`. Coming soon: trading restrictions can set a lower maximum for the account. The market''s `max_leverage` also applies.'
                  example: 5
                request:
                  type: string
                  example: '{{request}}'
                nonce:
                  type: integer
                  example: 1594297865000
            example:
              leverage: 5
              request: '{{request}}'
              nonce: 1594297865000
      responses:
        '200':
          description: Successful response - leverage changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  leverage:
                    type: integer
                    description: Active leverage level for the collateral account after the update, from `1` (no leverage) to `100`
                    example: 5
              example:
                leverage: 5
        '422':
          description: 'Inner validation failed


            Error codes:

            - `30` - invalid `leverage` value (out of range, non-integer, or wrong type). Setting leverage above a market''s `max_leverage` also surfaces here as an out-of-range value. Coming soon: a value above the maximum allowed for the account by trading restrictions also returns `30`

            - `17` - the requested leverage is valid but available balance is insufficient to support it

            - `113` - leverage cannot be changed while open positions or orders exist

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
  /api/v4/collateral-account/hedge-mode:
    post:
      summary: Collateral Account Hedge Mode
      operationId: getCollateralHedgeMode
      description: 'The endpoint returns the current hedge mode status for the collateral trading account. When hedge mode is enabled (`true`), the account supports simultaneous long and short positions on the same market. When disabled (`false`), the account operates in one-way mode.


        Rate limit: 12000 requests/10 sec.'
