      - Collateral Trading
      security:
      - ApiKeyAuth: []
        PayloadAuth: []
        SignatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - market
              - id
              - request
              - nonce
              properties:
                market:
                  type: string
                  description: 'Market of the conditional order to cancel. Example: BTC_USDT'
                  example: BTC_USDT
                id:
                  type: integer
                  description: Conditional order identifier. Obtain from the [query unexecuted conditional orders](/api-reference/trading/query-unexecuted-conditional-orders) endpoint.
                  example: 117703764513
                request:
                  type: string
                  example: '{{request}}'
                nonce:
